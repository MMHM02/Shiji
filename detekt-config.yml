# detekt configuration for 食记 (ShiJi)
# Based on detekt v1.23.7

build:
  maxIssues: 0
  excludeCorrectable: false
  weights:
    complexity: 2
    formatting: 1
    LongParameterList: 1
    comments: 1

style:
  active: true
  MaxLineLength:
    active: true
    maxLineLength: 120
    excludePackageStatements: true
    excludeImportStatements: true
    excludeCommentStatements: false
  MagicNumber:
    active: true
    ignoreNumbers: [-1, 0, 1, 2, 100, 1000]
    ignoreHashCodeFunction: true
    ignorePropertyDeclaration: true
    ignoreLocalVariableDeclaration: false
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
    ignoreNamedArgument: true
    ignoreEnums: true
    ignoreRanges: true
    ignoreExtensionFunctions: true
  ForbiddenComment:
    active: true
    values: ["TODO:", "FIXME:", "STOPSHIP:"]
    allowedPatterns: ""
    customMessage: ""
  UnusedImports:
    active: true
  WildcardImport:
    active: true
    excludeImports: []

complexity:
  active: true
  LongParameterList:
    active: true
    functionThreshold: 6
    constructorThreshold: 7
    ignoreDefaultParameters: true
    ignoreDataClasses: true
    ignoreAnnotatedParameter: ["Composable"]
  TooManyFunctions:
    active: true
    ignoreDeprecated: true
    ignorePrivate: true
    ignoreOverridden: true

naming:
  active: true
  PackageNaming:
    active: true
    packagePattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$'

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: true
    excludes: []

performance:
  active: true
  SpreadOperator:
    active: true

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true
